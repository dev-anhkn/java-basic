plugins {    id 'java'    id 'idea'    id 'org.springframework.boot' version '3.3.5' apply false    id 'io.spring.dependency-management' version '1.1.7' apply false}group = 'org.example'version = '1.0-SNAPSHOT'java {    toolchain {        languageVersion = JavaLanguageVersion.of(17)    }}allprojects {    repositories {        mavenLocal()        mavenCentral()        maven { url 'https://repo.spring.io/release' }    }}subprojects {    apply plugin: 'java'    apply plugin: 'io.spring.dependency-management'    apply plugin: 'org.springframework.boot'    dependencyManagement {        imports {            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"        }    }    dependencies {        implementation 'org.springframework.boot:spring-boot-starter-web'        // Thêm Lombok vào thời gian biên dịch và annotation processing        compileOnly 'org.projectlombok:lombok:1.18.34'        annotationProcessor 'org.projectlombok:lombok:1.18.34'        implementation 'org.postgresql:postgresql:42.7.3'        implementation 'com.zaxxer:HikariCP:6.2.1'        implementation 'org.slf4j:slf4j-simple:2.0.13' // thêm dòng này!    }}tasks.withType(JavaCompile).configureEach {    options.encoding = 'UTF-8'}