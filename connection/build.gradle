plugins {    id 'java'}group = 'org.example'version = '1.0-SNAPSHOT'repositories {    mavenCentral()}dependencies {    // PostgreSQL JDBC driver    implementation 'org.postgresql:postgresql:42.7.3'    // HikariCP connection pool    implementation 'com.zaxxer:HikariCP:6.2.1'    testImplementation platform('org.junit:junit-bom:5.9.1')    testImplementation 'org.junit.jupiter:junit-jupiter'}test {    useJUnitPlatform()}