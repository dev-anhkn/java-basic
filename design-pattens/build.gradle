plugins {    id 'org.springframework.boot' version '3.4.1'    id 'io.spring.dependency-management' version '1.1.7'    id 'java'}group = "com.example"version = "1.0.0"java.sourceCompatibility = JavaVersion.VERSION_17repositories {    mavenCentral()}dependencies {    implementation("org.springframework.boot:spring-boot-starter")    implementation("org.springframework.boot:spring-boot-starter-logging")}